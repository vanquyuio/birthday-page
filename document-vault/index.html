<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Kho Giấy Tờ Thông Minh</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}header{background:linear-gradient(135deg,#155eef,#6d28d9);color:#fff;padding:28px 18px}header h1{margin:0;font-size:32px}header p{margin:8px 0 0;opacity:.9}.wrap{max-width:1100px;margin:auto;padding:22px 16px}.panel{background:#fff;border-radius:18px;padding:20px;margin-bottom:18px;box-shadow:0 8px 28px #0f172a14}.btn{border:0;border-radius:10px;padding:11px 16px;background:#155eef;color:#fff;font-weight:700;cursor:pointer;margin:4px}.btn.secondary{background:#e8eefc;color:#1748bd}.btn.danger{background:#fee2e2;color:#b91c1c}.btn:disabled{opacity:.5;cursor:not-allowed}.drop{border:2px dashed #9bb4ef;border-radius:14px;padding:28px;text-align:center;background:#f8faff}.drop input{display:none}#preview{max-width:100%;max-height:330px;margin:16px auto;display:none;border-radius:12px}.status{padding:12px;border-radius:10px;background:#eef4ff;margin-top:12px;display:none}.search{display:flex;gap:10px}.search input{flex:1;padding:13px;border:1px solid #d7deeb;border-radius:10px;font-size:16px}.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}.card{border:1px solid #e5e9f2;border-radius:14px;overflow:hidden}.card img{width:100%;height:170px;object-fit:cover;background:#eef2f7}.content{padding:14px}.content h3{margin:0 0 8px}.snippet{font-size:13px;color:#5d6678;white-space:pre-wrap;max-height:90px;overflow:hidden}.meta{font-size:12px;color:#7b8495;margin-top:10px}.tag{font-size:12px;background:#eef2ff;color:#4338ca;padding:5px 9px;border-radius:99px}.toprow{display:flex;justify-content:space-between;gap:10px;align-items:center}.hidden{display:none!important}.empty{text-align:center;color:#6b7280;padding:28px}@media(max-width:650px){.search{flex-direction:column}header h1{font-size:25px}}
</style>
</head>
<body>
<header><div class="wrap"><div class="toprow"><div><h1>📄 Kho Giấy Tờ Thông Minh</h1><p>Ảnh giấy tờ → OCR → lưu cloud → tìm kiếm nội dung</p></div><span class="tag">🌐 Chế độ công khai</span></div></div></header>
<main class="wrap">
<section class="panel" id="setupBox"><b>⚙️ Đang khởi tạo kết nối...</b><p id="setupMessage">Đang kết nối website với Supabase.</p></section>
<section class="panel hidden" id="appBox"><h2>1. Thêm giấy tờ</h2><div class="drop" id="dropZone"><p><b>Chụp ảnh hoặc chọn ảnh giấy tờ</b></p><label class="btn" for="cameraInput">📷 Chụp ảnh</label><label class="btn secondary" for="fileInput">🖼️ Chọn ảnh</label><input id="cameraInput" type="file" accept="image/*" capture="environment"><input id="fileInput" type="file" accept="image/*"></div><img id="preview" alt="Xem trước giấy tờ"><div id="status" class="status"></div><div id="saveArea" class="hidden" style="text-align:center"><button class="btn" id="saveBtn">☁️ Lưu vào database</button></div></section>
<section class="panel hidden" id="searchBox"><div class="toprow"><h2>2. Tìm kiếm</h2><span class="tag" id="count">0 giấy tờ</span></div><div class="search"><input id="searchInput" placeholder="Ví dụ: hợp đồng, Nguyễn Văn A, số hóa đơn..."><button class="btn" id="searchBtn">🔎 Tìm kiếm</button></div></section>
<section class="panel hidden" id="resultBox"><div id="results" class="results"></div></section>
</main>
<script>
const SUPABASE_URL='https://jxbbagauryqhwhyidzjn.supabase.co';
const SUPABASE_KEY='sb_publishable_0LRGbwzijO9_tH3Ur5B2cw_q0IMCN3L';
const $=id=>document.getElementById(id);let db=null,currentFile=null,currentText='';
function showSetup(message){$('setupBox').classList.remove('hidden');$('setupMessage').textContent=message}
function showStatus(text){$('status').style.display='block';$('status').textContent=text}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function init(){try{if(!window.supabase||!window.supabase.createClient){showSetup('Không tải được thư viện Supabase. Hãy kiểm tra kết nối Internet rồi tải lại trang.');return}db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);$('setupBox').classList.add('hidden');$('appBox').classList.remove('hidden');$('searchBox').classList.remove('hidden');$('resultBox').classList.remove('hidden');render()}catch(e){showSetup('Không thể khởi tạo Supabase: '+e.message)}}
function handleFile(file){if(!file)return;if(!file.type.startsWith('image/'))return alert('Hiện tại chỉ hỗ trợ ảnh giấy tờ.');currentFile=file;currentText='';$('preview').src=URL.createObjectURL(file);$('preview').style.display='block';$('saveArea').classList.add('hidden');showStatus('⏳ Đang nhận diện văn bản...');Tesseract.recognize(file,'vie+eng',{logger:m=>{if(m.status==='recognizing text')showStatus('⏳ Đang nhận diện: '+Math.round(m.progress*100)+'%')}}).then(({data})=>{currentText=(data.text||'').trim();showStatus(currentText?'✅ Đã nhận diện xong.':'⚠️ Không nhận diện được nhiều chữ, hãy thử ảnh rõ hơn.');$('saveArea').classList.remove('hidden')}).catch(e=>showStatus('❌ Lỗi OCR: '+e.message))}
$('cameraInput').onchange=e=>handleFile(e.target.files[0]);$('fileInput').onchange=e=>handleFile(e.target.files[0]);$('dropZone').ondragover=e=>e.preventDefault();$('dropZone').ondrop=e=>{e.preventDefault();handleFile(e.dataTransfer.files[0])};
$('saveBtn').onclick=async()=>{if(!currentFile||!db)return;const title=prompt('Đặt tên cho giấy tờ:',currentFile.name.replace(/\.[^.]+$/,''));if(!title)return;try{$('saveBtn').disabled=true;showStatus('☁️ Đang tải ảnh lên cloud...');const safe=currentFile.name.replace(/[^a-zA-Z0-9._-]/g,'_');const path=Date.now()+'_'+Math.random().toString(36).slice(2,8)+'_'+safe;const {error:upErr}=await db.storage.from('documents').upload(path,currentFile,{contentType:currentFile.type});if(upErr)throw upErr;showStatus('☁️ Đang lưu nội dung vào database...');const {error:dbErr}=await db.from('documents').insert({title,ocr_text:currentText,image_path:path,original_name:currentFile.name,mime_type:currentFile.type});if(dbErr){await db.storage.from('documents').remove([path]);throw dbErr}currentFile=null;currentText='';$('preview').style.display='none';$('saveArea').classList.add('hidden');showStatus('✅ Đã lưu thành công trên cloud.');await render()}catch(e){showStatus('❌ Lỗi lưu dữ liệu: '+e.message)}finally{$('saveBtn').disabled=false}}
async function render(){if(!db)return;const q=$('searchInput').value.trim();let query=db.from('documents').select('*').order('created_at',{ascending:false});if(q){const clean=q.replace(/[,()%]/g,' ');query=query.or(`title.ilike.%${clean}%,ocr_text.ilike.%${clean}%`)}const {data,error}=await query;if(error){$('results').innerHTML='<div class="empty">❌ '+esc(error.message)+'</div>';return}$('count').textContent=data.length+' giấy tờ';const items=await Promise.all(data.map(async d=>{const {data:signed}=await db.storage.from('documents').createSignedUrl(d.image_path,3600);return {...d,url:signed?.signedUrl||''}}));$('results').innerHTML=items.length?items.map(d=>`<article class="card"><img src="${d.url}" alt="${esc(d.title)}"><div class="content"><h3>${esc(d.title)}</h3><div class="snippet">${esc(d.ocr_text||'Chưa có nội dung OCR')}</div><div class="meta">${new Date(d.created_at).toLocaleString('vi-VN')}</div><button class="btn secondary" onclick="viewDoc('${d.id}')">Xem nội dung</button><button class="btn danger" onclick="deleteDoc('${d.id}','${d.image_path.replace(/'/g,'')}')">Xóa</button></div></article>`).join(''):'<div class="empty">Chưa có giấy tờ nào.</div>'}
window.viewDoc=async id=>{const {data,error}=await db.from('documents').select('title,ocr_text').eq('id',id).single();if(error)return alert(error.message);alert('Tên giấy tờ: '+data.title+'\n\nNội dung nhận diện:\n'+(data.ocr_text||'Chưa có nội dung OCR'))};
window.deleteDoc=async(id,path)=>{if(!confirm('Xóa giấy tờ này khỏi cloud?'))return;const {error}=await db.from('documents').delete().eq('id',id);if(error)return alert(error.message);await db.storage.from('documents').remove([path]);await render()};
$('searchInput').oninput=()=>render();$('searchBtn').onclick=()=>render();window.addEventListener('load',init);
</script>
</body></html>
